<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moj Generali</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #fff;
      color: #20252b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 24px;
      border-bottom: 1px solid #e8e8e8;
    }

    header img { height: 40px; display: block; }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      background-image: linear-gradient(180deg, #af2219, #c21b17);
      color: #fff;
      border-radius: 4px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
    }

    .label {
      font-size: .875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 300;
      margin: 0 0 1rem;
      line-height: 1.2;
    }

    .desc {
      font-size: 1rem;
      font-weight: 300;
      margin: 0 0 2rem;
      opacity: .9;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 4px;
      height: 56px;
      padding: 0 2.5rem;
      min-width: 128px;
      border: 2px solid #fff;
      letter-spacing: .5px;
      width: 100%;
    }

    .btn-primary {
      background: #fff;
      color: #c21b17;
    }

    .btn-secondary {
      background: transparent;
      color: #fff;
    }

    @media (min-width: 480px) {
      .btn { width: auto; }
    }
  </style>
</head>
<body>

  <header>
    <a href="https://www.generali.si">
      <img src="https://www.generali.si/o/generali-theme/images/generali-logo-small.svg" alt="Generali" />
    </a>
  </header>

  <main>
    <div class="card">
      <p class="label">Naložite Moj Generali</p>
      <h1>Prenesite aplikacijo</h1>
      <p class="desc">S klikom na spodnji gumb se odpre trgovina za prenos aplikacije Moj Generali.</p>
      <div class="buttons">
        <a id="store-btn" class="btn btn-primary" href="#">Namesti aplikacijo</a>
      </div>
    </div>
  </main>

  <script>
    var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    document.getElementById('store-btn').href = ios
      ? 'https://apps.apple.com/si/app/moj-generali-slovenija/id6738954548'
      : 'https://play.google.com/store/apps/details?id=si.generali.moj.generali';
  </script>

</body>
</html>
