<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moj Generali</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #5c1a0a;
      color: #F4ECDF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
    p  { opacity: 0.65; margin: 0 0 36px; font-size: 15px; }
    .btn {
      display: inline-block;
      padding: 16px 40px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 18px;
      text-decoration: none;
      background: #F4ECDF;
      color: #5c1a0a;
    }
  </style>
</head>
<body>
  <h1>Moj Generali</h1>
  <p>Tapnite gumb za namestitev aplikacije.</p>
  <a class="btn" id="store-link" href="#">Namesti aplikacijo</a>

  <script>
    var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    document.getElementById('store-link').href = ios
      ? 'https://apps.apple.com/si/app/moj-generali-slovenija/id6738954548'
      : 'https://play.google.com/store/apps/details?id=si.generali.moj.generali';
  </script>
</body>
</html>
